# Air hot-reload config for identity.
# Run: make dev-identity   (or: air -c .air/identity.toml)
root = "."
tmp_dir = "tmp/air/identity"

[build]
  cmd = "go build -o ./tmp/air/identity/identity ./services/identity/cmd"
  entrypoint = ["./tmp/air/identity/identity"]
  # full_bin is the only way to set env vars inline; it overrides entrypoint for the run step.
  full_bin = "HTTP_PORT=8081 ./tmp/air/identity/identity"
  # Watch the service itself plus everything it shares with the others.
  include_dir = ["services/identity", "shared"]
  include_file = ["go.mod", "go.sum"]
  include_ext = ["go"]
  exclude_dir = ["bin", "tmp", "build", "bruno"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Send SIGINT so the service shuts down gracefully before the rebuilt binary starts.
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true
  rerun = false

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
