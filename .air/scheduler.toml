# Air hot-reload config for scheduler.
# Run: make dev-scheduler   (or: air -c .air/scheduler.toml)
root = "."
tmp_dir = "tmp/air/scheduler"

[build]
  cmd = "go build -o ./tmp/air/scheduler/scheduler ./services/scheduler/cmd"
  entrypoint = ["./tmp/air/scheduler/scheduler"]
  # Watch the service itself plus everything it shares with the others.
  include_dir = ["services/scheduler", "shared"]
  include_file = ["go.mod", "go.sum"]
  include_ext = ["go"]
  exclude_dir = ["bin", "tmp", "build", "bruno"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Send SIGINT so the service shuts down gracefully before the rebuilt binary starts.
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true
  rerun = false

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
