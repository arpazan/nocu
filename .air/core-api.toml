# Air hot-reload config for core-api.
# Run: make dev-core-api   (or: air -c .air/core-api.toml)
root = "."
tmp_dir = "tmp/air/core-api"

[build]
  cmd = "go build -o ./tmp/air/core-api/core-api ./services/core-api/cmd"
  entrypoint = ["./tmp/air/core-api/core-api"]
  # Watch the service itself plus everything it shares with the others.
  include_dir = ["services/core-api", "shared"]
  include_file = ["go.mod", "go.sum"]
  include_ext = ["go"]
  exclude_dir = ["bin", "tmp", "build", "bruno", "web", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Send SIGINT so the service shuts down gracefully before the rebuilt binary starts.
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true
  rerun = false

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
